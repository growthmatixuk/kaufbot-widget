<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KaufBot</title>
  <link rel="stylesheet" href="/agent/styles.css" />
  <script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
</head>
<body>
  <div id="agent-shell">
    <header id="agent-header">
      <div>
        <h1>KaufBot</h1>
        <p>Your Click Backdrops assistant</p>
      </div>
    </header>

    <main id="agent-main">
      <div id="agent-stage">
        <div id="agent-loading">Starting KaufBot…</div>
      </div>
    </main>

    <footer id="agent-footer">
      <button id="mic-btn" class="agent-btn">Mute mic</button>
      <button id="end-btn" class="agent-btn danger">End</button>
    </footer>
  </div>

  <script src="/agent/app.js"></script>
</body>
</html>
